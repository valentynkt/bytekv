# bytekv configuration file
# Each line: key value

# Network
port 9999
tcp-backlog 511

# Server tick rate (1-500)
hz 10

# Active key expiration
active-expire-enabled yes
active-expire-percent 25
active-expire-keys-per-round 20

# Client timeout (seconds, 0 = disabled)
client-timeout 300
client-timeout-check-hz 10

# AOF (append-only file) persistence
aof-enabled yes
aof-filename bytekv.aof
aof-check-hz 10
aof-rewrite-min-size 1048576
aof-rewrite-growth 100
# appendfsync: no | pertick | always
appendfsync always
